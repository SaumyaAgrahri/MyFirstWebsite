  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Document</title
  </head>
  <body>
    <h1>University Registration form</h1>
    <p>Please fill out the form</p>
    <hr>
    <h2>Personal Details</h2>
  <label for="name">First Name:</label>
  <input type ="text" name="name" id="name" placeholder="e.g:Akanksha">
  <br><br>
  <label for="lname">Last Name:</label>
  <input type="text" name="surname" id="lname" placeholder="e.g:Sharma">
  <br><br>
  <label for="dob">Date of Birth:</label>
  <input type="date" name="DOB" id="dob" >
  <br><br>
  <h3>Gender:</h3>
  <label for="Male">Male</label>
  <input type="radio" name="gender" id="Male" value="Male">
  <br>
  <label for="female">Female</label>
  <input type="radio" name="gender" id="female" value="Female">
  <br>
  <label for="other">Other</label>
  <input type="radio" name="gender" id="other" value="other">
  <h3>Upload Your Photo</h3>
  <input type="file" name="file">
  <h2>Contact Information</h2>
  <label for="email">Email Address</label>
  <input type="email" name="email" id="email">
  <br><br>
  <label for="phone">Phone</label>
  <input type="tel" name="phone" id="phone">
  <br><br>
  <label for="Address">Mailing Address</label>
  <br>
  <textarea name="Address" id="Address" rows="6" cols="20"></textarea>
  <br>
  <h2>Academic Information</h2>
  <label for="course">Select your Cousre:</label>
  <select name="cousre" id="course">
  <option value="CSE" >CSE</option>
  <option value="ME">ME</option>
  <option value="CE">CE</option>
  </select>
  <br>
  <h3>Extracurricular Avtivites:</h3>
  <label for="Sports">Sports</label>
  <input type="checkbox" name="intrest" id="Sports" value="Sports">
  <br><br>
  <label for="Music">Music</label>
  <input type="checkbox" name="intrest" id="Music" value="Music">
  <br><br>
  <label for="Technology">Technology</label>
  <input type="checkbox" name="intest" id="Technology" value="Technology">
  <br><br>
  <h2>Create your Account</h2>
  <label for="pass">Create a Password:</label>
  <input type="password" name="password" id="pass">
  <br><br>
  <label for="security">Security Question:</label>
  <select name="security" id="security">what was your first pet's name?</select>
  <br><br>
  <label for="secu">Security Answer:</label>
  <input type="checkbox" name="secu" id="secu">
  <br><br>
  <label for="T&C">I agree to the Terms and Conditions</label>
  <input type="checkbox" name="T&C" id="T&C">
  <br><br>
  <hr>
  <button type="submit">Register</button>
  <button type="reset">Clear form</button>
</body>
  </html>
